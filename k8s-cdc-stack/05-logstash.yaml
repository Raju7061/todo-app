apiVersion: apps/v1
kind: Deployment
metadata:
  name: logstash
  namespace: cdc-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logstash
  template:
    metadata:
      labels:
        app: logstash
    spec:
      containers:
      - name: logstash
        image: docker.elastic.co/logstash/logstash:8.11.0
        env:
        - name: LS_JAVA_OPTS
          value: "-Xms256m -Xmx256m"
        - name: XPACK_MONITORING_ENABLED
          value: "false"
        volumeMounts:
        - name: config-volume
          mountPath: /usr/share/logstash/pipeline/logstash.conf
          subPath: logstash.conf
      volumes:
      - name: config-volume
        configMap:
          name: logstash-config
---
apiVersion: v1
kind: Service
metadata:
  name: logstash
  namespace: cdc-stack
spec:
  ports:
  - port: 5044
    targetPort: 5044
  selector:
    app: logstash