apiVersion: apps/v1
kind: Deployment
metadata:
  name: zookeeper
  namespace: cdc-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zookeeper
  template:
    metadata:
      labels:
        app: zookeeper
    spec:
      containers:
      - name: zookeeper
        image: confluentinc/cp-zookeeper:7.5.0
        ports:
        - containerPort: 2181
        env:
        - name: ZOOKEEPER_CLIENT_PORT
          value: "2181"
        - name: ZOOKEEPER_TICK_TIME
          value: "2000"
        readinessProbe:
          exec:
            command: ["sh", "-c", "echo ruok | nc localhost 2181"]
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: zookeeper
  namespace: cdc-stack
spec:
  ports:
  - port: 2181
    targetPort: 2181
  selector:
    app: zookeeper